version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: bot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data


  redis:
    image: redis:alpine
    container_name: bot_redis
    restart: always
    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data: